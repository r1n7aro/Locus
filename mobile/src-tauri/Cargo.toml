[package]
name = "locus-remote"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Locus Remote: phone client for a paired Locus desktop"

# Built on its own; shares only the wire protocol crate with the desktop.
[workspace]

[lib]
name = "locus_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
locus-remote-protocol = { path = "../../crates/locus-remote-protocol" }
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-opener = "~2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS: ring only (simple Android cross-compilation), TLS 1.3, our own
# verifiers (pinned self-signed certificate or webpki roots).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
base64 = "0.23.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "~2.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

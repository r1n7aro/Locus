[package]
name = "locus-native-protocol"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Wire protocol shared by the Locus native brokers (Unity, Blender) and the Locus desktop app"
publish = false

# Standalone workspace, referenced by path from `src-tauri`, `crates/locus-native-broker`
# and the host DLL crates (same convention as `crates/locus-remote-protocol`).
[workspace]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
